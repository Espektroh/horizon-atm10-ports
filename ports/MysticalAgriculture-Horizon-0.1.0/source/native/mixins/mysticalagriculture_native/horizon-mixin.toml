[mod]
id = "mysticalagriculture_native"
version = "0.1.0"
priority = 80

# Mystical Agriculture + Agradditions for Horizon (content mods `mysticalagriculture` and
# `mysticalagradditions`). Written for Nightly 66f3981 (2026-11-05). Hooks: loot drops (API 75),
# using an item on a block (API 13), random ticks (API 33), bone meal (API 72), the crafting
# grid's remainders, Options > Mods, and two places in the content loader that tie each seed to
# its crop (the same two Inferium Lab uses on this Nightly).
[compatibility]
horizon_revision = "66f3981f522b24c250b21523a70080965b940424"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "mysticalagriculture_rt"
source = "runtime.rs"

[[module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "mysticalagriculture_glue"
source = "glue.rs"

[[injection]]
id = "loot-drops"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_loot_drops"
helper = "loot_drops.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "context", ty = "&horizon_client::mod_api::NativeLootDrops<'_>", value = "context" },
  { name = "drops", ty = "&mut Vec<horizon_client::items::ItemStack>", value = "&mut *drops" },
]

[[injection]]
id = "use-item-on"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_use_item_on"
helper = "use_item_on.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "claimed", ty = "&mut bool", value = "&mut *claimed" },
]

[[injection]]
id = "random-tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::GameLevel<'_>::native_random_tick"
helper = "random_tick.rs"
bindings = [
  { name = "level", ty = "&crate::game::GameLevel<'_>", value = "&*self" },
  { name = "pos", ty = "horizon_core::position::BlockPos", value = "pos" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
  { name = "handled", ty = "&mut bool", value = "&mut *handled" },
]

[[injection]]
id = "bone-meal"
kind = "HEAD"
target = "horizon_client::game::native_hooks::GameLevel<'_>::native_is_valid_bonemeal_target"
helper = "bone_meal.rs"
bindings = [
  { name = "level", ty = "&crate::game::GameLevel<'_>", value = "self" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
  { name = "valid", ty = "&mut Option<bool>", value = "&mut *valid" },
]

[[injection]]
id = "remainders"
kind = "HEAD"
cancellable = true
target = "horizon_client::crafting::Recipes::remainders"
helper = "remainders.rs"
bindings = [
  { name = "recipes", ty = "&horizon_client::crafting::Recipes", value = "self" },
  { name = "recipe", ty = "&str", value = "recipe" },
  { name = "grid", ty = "&[Option<horizon_client::items::ItemStack>]", value = "grid" },
  { name = "size", ty = "usize", value = "size" },
]

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

# The crop's gameplay row names its seeds as its item (pick block, villagers).
[[injection]]
id = "crop-seed"
kind = "HEAD"
target = "horizon_client_lib::mod_content::Plan<'_>::override_gameplay"
helper = "crop_seed.rs"
bindings = [
  { name = "block", ty = "&NewBlock", value = "b" },
  { name = "row", ty = "&mut J", value = "&mut *row" },
]

# Each seed (a copy of wheat seeds) places its own crop, not wheat.
[[injection]]
id = "seed-crop"
kind = "HEAD"
target = "horizon_client_lib::mod_content::J::rename"
helper = "seed_crop.rs"
bindings = [
  { name = "row", ty = "&mut J", value = "&mut *self" },
  { name = "rename", ty = "&Rename", value = "r" },
]
