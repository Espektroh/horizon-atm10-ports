[mod]
id = "mekanism_native"
version = "0.6.1"
priority = 100

# Built and tested on Nightly 66f3981 (2026-11-05), the one AE2 15.4.14 pins.
# Besides the hook points it reads the game's recipes, items, fuels, time and sky (glue.rs).
[compatibility]
horizon_revision = "66f3981f522b24c250b21523a70080965b940424"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "mekanism_native"
source = "runtime.rs"

[[module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "mekanism_glue"
source = "glue.rs"

[[injection]]
id = "block-entity"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity"
helper = "block_entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, horizon_world::nbt::Compound)>", value = "&mut *entity" },
]

[[injection]]
id = "ticks"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_ticks"
helper = "ticks.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "&mut *ticks" },
]

[[injection]]
id = "container"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_container"
helper = "container.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "container", ty = "&mut Option<horizon_client::containers::ModContainer>", value = "&mut *container" },
]

[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_tick"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut horizon_client::containers::ModBlockEntity", value = "&mut *entity" },
]

[[injection]]
id = "screen"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_screen"
helper = "screen.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "screen", ty = "&mut Option<crate::game::native_hooks::NativeScreen>", value = "&mut *screen" },
]

[[injection]]
id = "screen-draw"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_screen_draw"
helper = "screen_draw.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "block", ty = "&str", value = "block" },
  { name = "data", ty = "&[i32]", value = "data" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "origin", ty = "[f32; 2]", value = "origin" },
]

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "right-click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_right_click_block"
helper = "right_click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "destroy"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_destroy_block"
helper = "destroy.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "cable-shape"
kind = "HEAD"
target = "horizon_client::game::native_hooks::GameLevel<'_>::native_update_shape"
helper = "cable_shape.rs"
bindings = [
  { name = "level", ty = "&crate::game::GameLevel<'_>", value = "&*self" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
  { name = "direction", ty = "horizon_core::geometry::Direction", value = "direction" },
  { name = "neighbour", ty = "horizon_world::registry::BlockStateId", value = "neighbour" },
  { name = "new", ty = "&mut Option<horizon_world::registry::BlockStateId>", value = "&mut *new" },
]

[[injection]]
id = "quick-move"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_menu_quick_move"
helper = "quick_move.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "entity", ty = "&mut horizon_client::containers::ModBlockEntity", value = "&mut *entity" },
  { name = "container_slots", ty = "usize", value = "container_slots" },
  { name = "slot", ty = "usize", value = "slot" },
  { name = "stack", ty = "&mut horizon_client::items::ItemStack", value = "&mut *stack" },
  { name = "handled", ty = "&mut bool", value = "&mut *handled" },
]
