[mod]
id = "bibliocraft_native"
version = "0.1.0"
priority = 100

# Bibliocraft Legacy 1.6.6 furniture for Horizon (content mod `bibliocraft`): bookcases, shelves,
# tables and the sword pedestal (block entities, screens, clicks, drawing).
# Written for Nightly 66f3981 (2026-11-05), the commit the user's other native mods pin; also
# checked by the CI on Nightly 2ebf00a. Besides the hook points it reads Game fields (world,
# offhand) and the private Game::held_mut, as functionalstorage_native does. Every API: APIS.md.
[compatibility]
horizon_revision = "66f3981f522b24c250b21523a70080965b940424"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "bibliocraft_rt"
source = "runtime.rs"

[[module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "bibliocraft_glue"
source = "glue.rs"

[[injection]]
id = "block-entity"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity"
helper = "block_entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, horizon_world::nbt::Compound)>", value = "&mut *entity" },
]

[[injection]]
id = "ticks"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_ticks"
helper = "ticks.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "&mut *ticks" },
]

[[injection]]
id = "container"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_container"
helper = "container.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "container", ty = "&mut Option<horizon_client::containers::ModContainer>", value = "&mut *container" },
]

[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_tick"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut horizon_client::containers::ModBlockEntity", value = "&mut *entity" },
]

[[injection]]
id = "accepts"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_container_accepts"
helper = "accepts.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "entity", ty = "&horizon_client::containers::ModBlockEntity", value = "&*entity" },
  { name = "slot", ty = "usize", value = "slot" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "cancel", ty = "&mut bool", value = "&mut *cancel" },
]

# An associated function (no self): what clients get of a furniture block.
[[injection]]
id = "update-tag"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_update_tag"
helper = "update_tag.rs"
bindings = [
  { name = "entity", ty = "&horizon_client::containers::ModBlockEntity", value = "&*entity" },
  { name = "tag", ty = "&mut Option<horizon_world::nbt::Compound>", value = "&mut *tag" },
]

[[injection]]
id = "submit"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_submit"
helper = "submit.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "block", ty = "&str", value = "block" },
  { name = "state", ty = "horizon_world::registry::BlockStateId", value = "state" },
  { name = "entity", ty = "&horizon_client::containers::ModBlockEntity", value = "&*entity" },
  { name = "draw", ty = "&mut crate::game::native_block_entity_draw::BlockEntityDraw", value = "&mut *draw" },
]

# An associated function (no self): the book models to bake.
[[injection]]
id = "standalone-models"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_standalone_models"
helper = "standalone_models.rs"
bindings = [
  { name = "models", ty = "&mut Vec<String>", value = "&mut *models" },
]

[[injection]]
id = "screen"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_screen"
helper = "screen.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "screen", ty = "&mut Option<crate::game::native_hooks::NativeScreen>", value = "&mut *screen" },
]

# In the horizon-client library (menu.rs), not the game: the helper uses nothing of the game.
[[injection]]
id = "menu-slot-rules"
kind = "HEAD"
target = "horizon_client::menu::native_menu_slot_rules"
helper = "menu_slot_rules.rs"
bindings = [
  { name = "menu", ty = "&str", value = "menu" },
  { name = "slot", ty = "usize", value = "slot" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "may_place", ty = "&mut bool", value = "&mut *may_place" },
  { name = "max_stack", ty = "&mut u32", value = "&mut *max_stack" },
]

[[injection]]
id = "right-click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_right_click_block"
helper = "right_click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "face", ty = "[i32; 3]", value = "face" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]
