[mod]
id = "sushigocrafting_native"
version = "0.1.0"
priority = 70

# Sushi Go Crafting for Horizon (content mod `sushigocrafting`). Written for Nightly 66f3981
# (2026-11-05) and checked by the CI on Nightly 2ebf00a (2026-11-07). Hooks: block entities (the
# cutting board, the rice cooker, the fermentation barrel: slots, ticks, screens, shift-click, the
# board's item drawn), right clicks, using an item on a block (bone meal), random ticks (crops,
# sapling, leaves), bone meal targets, where rice stands, loot drops, fishing, the crafting grid's
# remainders (the Roller stays), Options > Mods, and two places in the content loader that tie each
# seed to its crop (the ones Mystical Agriculture's port uses). Every API used: APIS.md.
[compatibility]
horizon_revision = "66f3981f522b24c250b21523a70080965b940424"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "sushigocrafting_rt"
source = "runtime.rs"

[[module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "sushigocrafting_glue"
source = "glue.rs"

[[injection]]
id = "block-entity"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity"
helper = "block_entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, horizon_world::nbt::Compound)>", value = "&mut *entity" },
]

[[injection]]
id = "ticks"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_ticks"
