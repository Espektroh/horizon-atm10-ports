# The crop's gameplay row names its seeds as its item (pick block).
[[injection]]
id = "crop-seed"
kind = "HEAD"
target = "horizon_client_lib::mod_content::Plan<'_>::override_gameplay"
helper = "crop_seed.rs"
bindings = [
  { name = "block", ty = "&NewBlock", value = "b" },
  { name = "row", ty = "&mut J", value = "&mut *row" },
]

# Each seed (a copy of wheat or beetroot seeds) places its own crop.
[[injection]]
id = "seed-crop"
kind = "HEAD"
target = "horizon_client_lib::mod_content::J::rename"
helper = "seed_crop.rs"
bindings = [
  { name = "row", ty = "&mut J", value = "&mut *self" },
  { name = "rename", ty = "&Rename", value = "r" },
]
