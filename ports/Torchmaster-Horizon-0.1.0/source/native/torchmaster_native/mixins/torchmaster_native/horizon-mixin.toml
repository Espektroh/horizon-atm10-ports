[mod]
id = "torchmaster_native"
version = "0.1.0"
priority = 100

# Written for Nightly 66f3981 (2026-11-05), the commit the user's other native mods pin.
# Besides the hook points it reads Game fields (dim, world, pack) and forces
# NaturalLevel::spawn_hooks, so it pins that commit.
[compatibility]
horizon_revision = "66f3981f522b24c250b21523a70080965b940424"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "torchmaster_rt"
source = "runtime.rs"

[[module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "torchmaster_glue"
source = "glue.rs"

# Natural spawning builds the spawn list through native_potential_spawns only
# when spawn_hooks() is true, which without trait mods it is not
# (natural_spawning.rs:450, spawn_selection.rs:692). While a light is
# registered, answer true; otherwise the original body runs.
[[injection]]
id = "spawn-hooks"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::natural_spawning::<GameLevel<'_,'_> as NaturalLevel>::spawn_hooks"
helper = "spawn_hooks.rs"
bindings = []

[[injection]]
id = "potential-spawns"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_potential_spawns"
helper = "potential_spawns.rs"
bindings = [
  { name = "dimension", ty = "&str", value = "dimension" },
  { name = "category", ty = "&str", value = "category" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "village-siege"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_village_siege"
helper = "village_siege.rs"
bindings = [
  { name = "dimension", ty = "&str", value = "dimension" },
  { name = "attempted_pos", ty = "[f64; 3]", value = "attempted_pos" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "level-tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_level_tick_pre"
helper = "level_tick.rs"
bindings = [
  { name = "dimension", ty = "&str", value = "dimension" },
]

[[injection]]
id = "lifecycle"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_world_lifecycle"
helper = "lifecycle.rs"
bindings = []

[[injection]]
id = "block-entity"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity"
helper = "block_entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, horizon_world::nbt::Compound)>", value = "&mut *entity" },
]

[[injection]]
id = "ticks"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_ticks"
helper = "ticks.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "&mut *ticks" },
]

[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_block_entity_tick"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut horizon_client::containers::ModBlockEntity", value = "&mut *entity" },
]

# Low priority: runs after the other mods' destroy hooks, so it sees their cancel.
[[injection]]
id = "destroy"
kind = "HEAD"
priority = 10
target = "horizon_client::game::native_hooks::Game<'_>::native_destroy_block"
helper = "destroy.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]
